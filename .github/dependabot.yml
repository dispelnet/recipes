# Actions are pinned to commit SHAs, because checker.yml hands a token to them
# and release.yml can publish and sign with them. A pin nothing updates goes
# stale, so Dependabot proposes new SHAs as reviewed pull requests.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
