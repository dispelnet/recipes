# With fast hellos the dead time reads "NNN msec".

family:   cisco_ios
question: ospf-neighbors
applies:  ["*"]

steps:
  - run: show ip ospf neighbor
    template: |
      Value NEIGHBOR_ID (\d+\.\d+\.\d+\.\d+)
      Value STATE (\w+)
      Value ADDRESS (\d+\.\d+\.\d+\.\d+)
      Value INTERFACE (\S+)

      Start
        ^\s*${NEIGHBOR_ID}\s+\d+\s+${STATE}/\s*\S+\s+\S+(\s+msec)?\s+${ADDRESS}\s+${INTERFACE}\s*$$ -> Record
    fields:
      identity: NEIGHBOR_ID
      address:  ADDRESS
      state:    {from: STATE, lower: true}
      port:     INTERFACE
