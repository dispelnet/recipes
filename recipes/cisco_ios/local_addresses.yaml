# The addresses this device holds itself.
#
# Interfaces with none print the literal word `unassigned`. The value matches
# only an address, so those lines match no rule and record nothing -- which is
# how a text reader says "skip this" without a conditional.
#
# Capture:
#   source: networktocode/ntc-templates
#   commit: c6dca50ea10fe5a23e750748582fddda263fb053
#   file:   tests/cisco_ios/show_ip_interface_brief/cisco_ios_show_ip_interface_brief.raw
#   match:  exact

family:   cisco_ios
question: local-addresses
applies:  ["*"]

steps:
  - run: show ip interface brief
    template: |
      Value INTERFACE (\S+)
      Value ADDRESS (\d+\.\d+\.\d+\.\d+)

      Start
        ^${INTERFACE}\s+${ADDRESS}\s+\S+\s -> Record
    fields:
      identity: ADDRESS
