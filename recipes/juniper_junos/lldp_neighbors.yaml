# Physical neighbours, by the name each one calls itself.
#
# Junos puts the system name last and a chassis id in the middle. The name is
# the identity: a chassis id is durable but says nothing a human or another
# device would recognise.
#
# Capture:
#   source: networktocode/ntc-templates
#   commit: c6dca50ea10fe5a23e750748582fddda263fb053
#   file:   tests/juniper_junos/show_lldp_neighbors/juniper_junos_show_lldp_neighbors_ae7.raw
#   match:  exact

family:   juniper_junos
question: lldp-neighbors
applies:  ["*"]

steps:
  - run: show lldp neighbors
    template: |
      Value LOCAL_PORT (\S+)
      Value NEIGHBOR_PORT (\S+)
      Value NEIGHBOR (\S+)

      Start
        ^Local Interface -> Table

      Table
        ^${LOCAL_PORT}\s+\S+\s+\S+\s+${NEIGHBOR_PORT}\s+${NEIGHBOR}\s*$$ -> Record
    fields:
      identity: NEIGHBOR
      port:     NEIGHBOR_PORT
