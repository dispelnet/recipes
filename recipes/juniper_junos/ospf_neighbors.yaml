family:   juniper_junos
question: ospf-neighbors
applies:  ["*"]

steps:
  - run: show ospf neighbor
    template: |
      Value ADDRESS (\d+\.\d+\.\d+\.\d+)
      Value INTERFACE (\S+)
      Value STATE (\S+)
      Value NEIGHBOR_ID (\d+\.\d+\.\d+\.\d+)

      Start
        ^${ADDRESS}\s+${INTERFACE}\s+${STATE}\s+${NEIGHBOR_ID}\s+\d+\s+\d+\s*$$ -> Record
    fields:
      identity: NEIGHBOR_ID
      address:  ADDRESS
      state:    {from: STATE, lower: true}
      port:     INTERFACE
