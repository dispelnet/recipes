family:   cisco_nxos
question: addresses
applies:  ["*"]

steps:
  - run: show ip arp
    template: |
      Value ADDRESS (\d+\.\d+\.\d+\.\d+)
      Value MAC ([0-9a-f]{4}\.[0-9a-f]{4}\.[0-9a-f]{4})

      Start
        ^${ADDRESS}\s+\S+\s+${MAC}\s -> Record
    fields:
      address: ADDRESS
      mac:     MAC
