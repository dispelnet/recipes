# Physical neighbours, by the name each one calls itself.
#
# A device whose name is longer than the column wraps onto its own line, so the
# name is remembered and the row that follows completes it -- which is why this
# is two rules rather than one.
#
# Remembering it is also why the port is `Required`. Without that, the name
# outlives the last row and TextFSM's end-of-input record emits it again with
# no port: a neighbour that does not exist, which a crawl would then try to
# resolve.
#
# Capture:
#   source: networktocode/ntc-templates
#   commit: c6dca50ea10fe5a23e750748582fddda263fb053
#   file:   tests/cisco_nxos/show_lldp_neighbors/cisco_nxos_show_lldp_neighbors.raw
#   match:  exact

family:   cisco_nxos
question: lldp-neighbors
applies:  ["*"]

steps:
  - run: show lldp neighbors
    template: |
      Value Filldown NEIGHBOR (\S+)
      Value LOCAL_PORT (\S+)
      Value Required NEIGHBOR_PORT (\S+)

      Start
        ^Device ID\s+Local Intf -> Table

      Table
        ^${NEIGHBOR}\s+${LOCAL_PORT}\s+\d+\s+\S*\s+${NEIGHBOR_PORT}\s*$$ -> Record
        ^${NEIGHBOR}\s*$$
        ^\s+${LOCAL_PORT}\s+\d+\s+\S*\s+${NEIGHBOR_PORT}\s*$$ -> Record
    fields:
      identity: NEIGHBOR
      port:     NEIGHBOR_PORT
