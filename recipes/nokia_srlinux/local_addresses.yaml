# The addresses this device holds, which is how a neighbour table entry
# elsewhere becomes a link to this device.
#
# Every other address question asks what a device has *seen*. This one asks what
# it *is*: a leaf reports its host as an ARP entry on a bridge, and nothing
# relates that entry to the host until the host says the address is its own.
# Like router-id, that is a fact to collect rather than a resemblance to notice.
#
# The address carries its prefix length, which is a property of the subnet
# rather than of the device, so it is trimmed off.
#
# local_addresses.captured beside this file is what the device answered.

family:   nokia_srlinux
question: local-addresses
applies:  ["24.*"]
verified: nokia_srlinux 24.10.1

# The interface holding an address is the parent of the address, so this is two
# steps: select the interfaces and read their names, then look inside each one.
# Both families, for the same reason the neighbour table reads both: a device
# reached over IPv6 that only ever claimed its IPv4 addresses would not
# recognise the address it was reached on as its own.
steps:
  - id: v4interfaces
    run: info from state /interface * subinterface * ipv4 address * | as json
    select: interface[*]
    fields:
      port: name

  - id: ipv4
    from: v4interfaces
    select: subinterface[*].ipv4.address[*]
    fields:
      identity: {from: ip-prefix, before: "/"}

  - id: v6interfaces
    run: info from state /interface * subinterface * ipv6 address * | as json
    select: interface[*]
    fields:
      port: name

  - id: ipv6
    from: v6interfaces
    select: subinterface[*].ipv6.address[*]
    fields:
      identity: {from: ip-prefix, before: "/"}

  - join: [ipv4, ipv6]
    on: identity
