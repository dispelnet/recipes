# What a device calls itself, which is what tells a crawl that two addresses
# are one device.
#
# `hostname` answers one bare word. The short form has no place for a
# template, so this is written as a step: one value, recorded from the only
# line, which is the smallest TextFSM template that can exist.

family:   linux
question: hostname
applies:  ["*"]
verified: linux 7.0.0-30-generic

steps:
  - run: hostname
    template: |
      Value NAME (\S+)

      Start
        ^${NAME} -> Record
    fields:
      hostname: NAME
