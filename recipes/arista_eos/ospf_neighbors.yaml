# Older EOS has no Instance column. The role after the state (FULL/BDR) is
# dropped.

family:   arista_eos
question: ospf-neighbors
applies:  ["*"]

steps:
  - run: show ip ospf neighbor
    template: |
      Value NEIGHBOR_ID (\d+\.\d+\.\d+\.\d+)
      Value STATE (\w+)
      Value ADDRESS (\d+\.\d+\.\d+\.\d+)
      Value INTERFACE (\S+)

      Start
        ^${NEIGHBOR_ID}\s+(\d+\s+)?\S+\s+\d+\s+${STATE}(/\S+)?\s+\S+\s+${ADDRESS}\s+${INTERFACE}\s*$$ -> Record
    fields:
      identity: NEIGHBOR_ID
      address:  ADDRESS
      state:    {from: STATE, lower: true}
      port:     INTERFACE
